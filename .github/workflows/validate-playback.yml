name: Validate BD2026 playback test only
on:
  push:
    branches:
      - test/bd2026-playback-autopublish
    paths:
      - .github/workflows/validate-playback.yml
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/bd2026-playback-autopublish
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Worker syntax
        run: node --check worker-test-playback.js
      - name: Validate embedded frontend scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("index.html").read_text()
          scripts=re.findall(r"<script\b[^>]*>([\s\S]*?)</script>",s,re.I)
          Path("/tmp/bd2026-inline.js").write_text("\n;\n".join(x for x in scripts if x.strip()))
          print(f"Extracted {len(scripts)} script blocks")
          PY
          node --check /tmp/bd2026-inline.js
      - name: Verify owner access and queue contracts
        run: |
          grep -q '/api/auth/owner-access' index.html
          grep -q 'path === "/api/campaigns/featured"' worker-test-playback.js
          ! grep -q 'bd2026-api-test.invalid' index.html
