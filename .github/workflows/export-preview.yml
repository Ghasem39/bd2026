name: Export BD2026 HTML preview
on:
  push:
    branches:
      - test/bd2026-playback-autopublish
    paths:
      - BD2026-TEST-PREVIEW.html
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package preview
        run: |
          test -s BD2026-TEST-PREVIEW.html
          mkdir -p out
          cp BD2026-TEST-PREVIEW.html out/BD2026-TEST-PREVIEW.html
          cd out
          zip -q BD2026-TEST-PREVIEW.zip BD2026-TEST-PREVIEW.html
      - uses: actions/upload-artifact@v4
        with:
          name: BD2026-TEST-PREVIEW
          path: out/BD2026-TEST-PREVIEW.zip
          if-no-files-found: error
          retention-days: 3
